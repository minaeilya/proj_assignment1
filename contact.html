<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - My Blog</title>
    <link rel="stylesheet" href="css/stylesheet.css">
  </head>
  <body>
    <div class="form-container">
      <header class="form-header">
        <h1>Contact Us</h1>
        <p>
          Please fill out the form below and we will get back to you shortly.
        </p>
      </header>

      <main>
        <form action="#" method="POST">
          <!-- Text Input -->
          <div class="form-group">
            <label for="fullName">Full Name <span class="required" aria-hidden="true">*</span></label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Jane Doe"
              required
            />
          </div>

          <!-- Email Input -->
          <div class="form-group">
            <label for="email">Email Address <span class="required" aria-hidden="true">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="jane@example.com"
              required
            />
          </div>

          <div class="form-row">
            <!-- Number Input -->
            <div class="form-group">
              <label for="phone">Phone / Extension <span class="required" aria-hidden="true">*</span></label>
              <input
                type="number"
                id="phone"
                name="phone"
                placeholder="1234567890"
                min="0"
                required
              />
            </div>

            <!-- Date Input -->
            <div class="form-group">
              <label for="preferredDate">Preferred Callback Date</label>
              <input type="date" id="preferredDate" name="preferredDate" />
            </div>
          </div>

          <!-- Dropdown Menu (Select) -->
          <div class="form-group">
            <label for="department">Department / Topic <span class="required" aria-hidden="true">*</span></label>
            <select id="department" name="department" required>
              <option value="" disabled selected>
                -- Select a Department --
              </option>
              <option value="support">Customer Support</option>
              <option value="sales">Sales & Inquiries</option>
              <option value="billing">Billing & Accounting</option>
              <option value="feedback">General Feedback</option>
            </select>
          </div>

          <!-- Radio Buttons -->
          <fieldset>
            <legend>Preferred Contact Method</legend>
            <div class="choice-group">
              <label class="choice-label">
                <input type="radio" name="contactMethod" value="email" checked />
                Email
              </label>
              <label class="choice-label">
                <input type="radio" name="contactMethod" value="phone" />
                Phone Call
              </label>
              <label class="choice-label">
                <input type="radio" name="contactMethod" value="sms" />
                SMS / Text
              </label>
            </div>
          </fieldset>

          <!-- Checkboxes -->
          <fieldset>
            <legend>Services of Interest</legend>
            <div class="choice-group">
              <label class="choice-label">
                <input type="checkbox" name="services" value="consulting" />
                Consulting
              </label>
              <label class="choice-label">
                <input type="checkbox" name="services" value="web-dev" />
                Web Development
              </label>
              <label class="choice-label">
                <input type="checkbox" name="services" value="design" />
                UI/UX Design
              </label>
              <label class="choice-label">
                <input type="checkbox" name="services" value="newsletter" />
                Subscribe to Newsletter
              </label>
            </div>
          </fieldset>

          <!-- Large Text Box (Textarea) -->
          <div class="form-group">
            <label for="message">Message / Details <span class="required" aria-hidden="true">*</span></label>
            <textarea
              id="message"
              name="message"
              placeholder="Type your message here..."
              rows="5"
              required
            ></textarea>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </main>

      <footer style="margin-top: 1.5rem; border-top: none;">
        <nav aria-label="Secondary Navigation">
          <a href="index.html">Go Back to Home</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
